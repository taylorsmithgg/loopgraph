[project]
name = "loopgraph"
version = "0.1.0"
description = "Deterministic goal-state substrate for agent loops"
readme = "README.md"
license = "MIT"
authors = [{ name = "Taylor Smith" }]
keywords = ["agents", "llm", "coordination", "memory", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://taylorsmithgg.github.io/loopgraph/"
Source = "https://github.com/taylorsmithgg/loopgraph"

[project.scripts]
loopgraph = "loopgraph.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopgraph"]
